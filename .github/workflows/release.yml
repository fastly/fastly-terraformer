# Release workflow for fastly-terraformer
# This GitHub action publishes assets for release when a tag is created.
# It runs on any tag that matches the pattern "v*" (ie. v0.1.0).
name: release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.10'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag successful build
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CI_TAG="ci-success-${GITHUB_SHA::7}"
          git tag -a "$CI_TAG" -m "CI build successful for ${{ github.ref_name }}"
          git push origin "$CI_TAG"
