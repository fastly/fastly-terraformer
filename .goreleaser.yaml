# GoReleaser configuration for fastly-terraformer
# See: https://goreleaser.com/customization/
version: 2

project_name: fastly-terraformer

before:
  hooks:
    - go mod tidy

builds:
  - id: fastly-terraformer
    main: .
    binary: fastly-terraformer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - id: fastly-terraformer
    builds:
      - fastly-terraformer
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: fastly
    name: fastly-terraformer
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
